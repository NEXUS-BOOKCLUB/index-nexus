<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Join Nexus Book Club</title>


<link rel="stylesheet" href="style.css">



<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


</head>





<body>





<header>


<div class="logo">


<img src="assets/logo.jpeg" alt="Nexus Logo">



<div>


<h2>NEXUS</h2>


<span>Book Club • Machakos</span>


</div>


</div>





<nav>


<a href="index.html">

Home

</a>


<a href="discussion.html">

Discussion

</a>


<a href="join.html">

Join

</a>


</nav>



</header>









<main>



<section class="join-section">



<div class="container">



<h1>

Join Nexus Book Club

</h1>



<p>

Become part of a community where stories,
ideas and conversations connect people.

</p>







<div class="join-card">





<form action="https://formspree.io/f/mgogqvyn"
method="POST">





<input type="hidden"
name="_next"
value="thank-you.html">







<label>

Full Name

</label>


<input type="text"
name="name"
placeholder="Your full name"
required>







<label>

Email Address

</label>


<input type="email"
name="email"
placeholder="Your email address"
required>







<label>

Phone Number

</label>


<input type="tel"
name="phone"
placeholder="Your phone number">







<label>

Why would you like to join Nexus?

</label>


<textarea
name="message"
rows="5"
placeholder="Tell us about yourself and your reading interests">

</textarea>







<label class="checkbox">


<input type="checkbox"
name="agreement"
required>


I agree to participate in Nexus Book Club activities.


</label>







<button type="submit"
class="button">


Submit Membership Request


</button>






</form>





</div>


</div>


</section>


</main>









<footer>


<p>

© Nexus Book Club | Machakos, Kenya

</p>


</footer>





</body>

</html>
