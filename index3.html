<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Book Club — Machakos, Kenya</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>

        /* ========== BROWN LITERARY THEME ========== */
        :root {
            --primary: #4A2C20;
            --primary-light: #6B4226;
            --accent-gold: #C89B3C;
            --accent-gold-light: #E4C46A;
            --accent-red: #A94442;

            --cream: #F7F0E3;
            --cream-dark: #E8D8C3;

            --text-dark: #2B1B15;
            --text-light: #F7F0E3;
            --text-muted: #75645A;

            --shadow: 0 8px 32px rgba(74, 44, 32, 0.15);
            --shadow-hover: 0 12px 48px rgba(74, 44, 32, 0.25);

            --radius: 16px;
            --radius-sm: 8px;

            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;

            --max-width: 1200px;
            --nav-height: 72px;
        }


        /* ========== RESET & BASE ========== */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
            scroll-padding-top: var(--nav-height);
        }


        body {
            font-family: var(--font-sans);
            background: var(--cream);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }


        a {
            text-decoration: none;
            color: inherit;
        }


        img {
            max-width: 100%;
            display: block;
        }


        ul {
            list-style: none;
        }


        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
        }



        /* ========== UTILITY ========== */

        .section-title {
            font-family: var(--font-serif);
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }


        .section-subtitle {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            font-weight: 400;
        }


        .section-title .gold {
            color: var(--accent-gold);
        }


        .text-center {
            text-align: center;
        }


        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border: none;
            border-radius: 50px;

            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 0.95rem;

            cursor: pointer;
            transition: var(--transition);

            background: var(--primary);
            color: #fff;

            box-shadow: 0 4px 16px rgba(74,44,32,0.25);
        }


        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }


        .btn-gold {
            background: var(--accent-gold);
            color: var(--primary);
        }


        .btn-gold:hover {
            background: var(--accent-gold-light);
        }


        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            box-shadow: none;
        }


        .btn-outline:hover {
            background: var(--primary);
            color: #fff;
        }



        /* ========== WATERMARK ========== */

        .watermark {
            position: fixed;
            bottom: 20px;
            right: 20px;

            opacity: 0.06;
            pointer-events: none;
            z-index: 0;

            font-family: var(--font-serif);
            font-size: 4rem;
            font-weight: 700;

            color: var(--primary);

            letter-spacing: 0.1em;
            line-height: 1;

            text-transform: uppercase;
            transform: rotate(-6deg);

            user-select: none;
        }


        @media (max-width:768px){

            .watermark{
                font-size:2.4rem;
                bottom:12px;
                right:12px;
                opacity:0.04;
            }

        }



        /* ========== NAVIGATION ========== */

        .navbar {

            position: fixed;

            top:0;
            left:0;
            right:0;

            height:var(--nav-height);

            background:rgba(74,44,32,0.94);

            backdrop-filter:blur(12px);

            border-bottom:1px solid rgba(255,255,255,0.08);

            z-index:1000;

            transition:var(--transition);

        }


        .navbar .container {

            display:flex;
            align-items:center;
            justify-content:space-between;

            height:100%;

        }


        .nav-logo {

            display:flex;
            align-items:center;

            gap:12px;

            font-family:var(--font-serif);

            font-weight:700;

            font-size:1.5rem;

            color:#fff;

        }


        .nav-logo img {

            height:40px;

            width:auto;

            border-radius:6px;

        }


        .nav-logo .logo-text {

            display:flex;

            flex-direction:column;

            line-height:1.1;

        }


        .nav-logo .logo-text small {

            font-family:var(--font-sans);

            font-size:0.55rem;

            font-weight:400;

            color:var(--accent-gold);

            letter-spacing:0.15em;

            text-transform:uppercase;

        }


        .nav-links {

            display:flex;

            align-items:center;

            gap:8px;

        }


        .nav-links a {

            color:rgba(255,255,255,0.8);

            font-size:0.85rem;

            font-weight:500;

            padding:6px 14px;

            border-radius:50px;

            transition:var(--transition);

        }


        .nav-links a:hover {

            color:#fff;

            background:rgba(255,255,255,0.1);

        }


        .nav-links a.active {

            color:#fff;

            background:rgba(200,155,60,0.25);

        }
        /* ========== MOBILE NAVIGATION ========== */

        .nav-toggle {

            display:none;

            flex-direction:column;

            gap:5px;

            background:none;

            border:none;

            cursor:pointer;

            padding:4px;

        }


        .nav-toggle span {

            display:block;

            width:26px;

            height:2.5px;

            background:#fff;

            border-radius:4px;

            transition:var(--transition);

        }



        .nav-toggle.active span:nth-child(1){

            transform:rotate(45deg) translate(5px,5px);

        }


        .nav-toggle.active span:nth-child(2){

            opacity:0;

        }


        .nav-toggle.active span:nth-child(3){

            transform:rotate(-45deg) translate(5px,-5px);

        }



        /* ========== HERO SECTION ========== */


        .hero {

            padding:calc(var(--nav-height) + 60px) 0 80px;

            background:

            linear-gradient(

                145deg,

                var(--primary) 0%,

                var(--primary-light) 100%

            );

            color:#fff;

            position:relative;

            overflow:hidden;

        }


        .hero::before {

            content:'';

            position:absolute;

            top:-40%;

            right:-20%;

            width:80%;

            height:120%;

            background:

            radial-gradient(

                ellipse at 70% 50%,

                rgba(200,155,60,0.18),

                transparent 70%

            );

        }


        .hero .container {

            position:relative;

            z-index:1;

            display:grid;

            grid-template-columns:1fr 1fr;

            gap:60px;

            align-items:center;

        }


        .hero-content h1 {

            font-family:var(--font-serif);

            font-size:clamp(2.8rem,6vw,4.2rem);

            font-weight:700;

            line-height:1.12;

            margin-bottom:16px;

        }


        .hero-content h1 .gold {

            color:var(--accent-gold);

        }


        .hero-content .tagline {

            font-size:1.15rem;

            color:rgba(255,255,255,0.78);

            max-width:480px;

            margin-bottom:24px;

            font-weight:300;

            line-height:1.7;

        }


        .hero-badges {

            display:flex;

            flex-wrap:wrap;

            gap:12px;

            margin-top:20px;

        }


        .hero-badges span {

            background:rgba(255,255,255,0.1);

            backdrop-filter:blur(4px);

            padding:6px 18px;

            border-radius:50px;

            font-size:0.8rem;

            color:rgba(255,255,255,0.9);

            border:1px solid rgba(255,255,255,0.08);

        }


        .hero-visual {

            display:flex;

            justify-content:center;

            align-items:center;

        }


        .hero-visual .logo-display {

            width:100%;

            max-width:380px;

            aspect-ratio:1/1;

            background:rgba(255,255,255,0.06);

            border-radius:50%;

            display:flex;

            flex-direction:column;

            justify-content:center;

            align-items:center;

            border:2px solid rgba(255,255,255,0.1);

            padding:30px;

            text-align:center;

        }


        .logo-placeholder {

            font-family:var(--font-serif);

            font-size:4.5rem;

            font-weight:700;

            color:var(--accent-gold);

        }


        .logo-placeholder small {

            display:block;

            font-family:var(--font-sans);

            font-size:1rem;

            color:rgba(255,255,255,0.6);

            letter-spacing:0.2em;

        }


        .logo-sub {

            margin-top:12px;

            font-size:0.8rem;

            color:rgba(255,255,255,0.5);

            letter-spacing:0.1em;

        }



        /* ========== MISSION / VISION ========== */


        .mission-section {

            padding:80px 0 60px;

            background:#fff;

        }


        .mission-grid {

            display:grid;

            grid-template-columns:1fr 1fr;

            gap:40px;

            margin-top:20px;

        }


        .mission-card {

            background:var(--cream);

            padding:40px 36px;

            border-radius:var(--radius);

            box-shadow:var(--shadow);

            border:1px solid rgba(74,44,32,0.06);

            transition:var(--transition);

        }


        .mission-card:hover {

            transform:translateY(-4px);

            box-shadow:var(--shadow-hover);

        }


        .mission-card .icon {

            font-size:2.4rem;

            margin-bottom:12px;

        }


        .mission-card h3 {

            font-family:var(--font-serif);

            font-size:1.5rem;

            color:var(--primary);

            margin-bottom:8px;

        }


        .mission-card p {

            color:var(--text-muted);

            font-size:0.98rem;

            line-height:1.7;

        }



        /* ========== REGISTRATION SECTION ========== */


        .register-section {

            padding:80px 0;

            background:var(--cream);

        }


        .register-wrapper {

            display:grid;

            grid-template-columns:1fr 1fr;

            gap:60px;

            align-items:start;

        }


        .register-info h2 {

            font-family:var(--font-serif);

            font-size:2.2rem;

            color:var(--primary);

            margin-bottom:12px;

        }


        .register-info p {

            color:var(--text-muted);

            line-height:1.8;

            margin-bottom:20px;

        }


        .benefits {

            display:flex;

            flex-direction:column;

            gap:10px;

        }


        .benefits li {

            display:flex;

            align-items:center;

            gap:12px;

        }


        .benefits li::before {

            content:'✦';

            color:var(--accent-gold);

            font-size:1.2rem;

        }


        .register-form {

            background:#fff;

            padding:40px 36px;

            border-radius:var(--radius);

            box-shadow:var(--shadow);

        }


        .register-form input,
        .register-form select,
        .register-form textarea {

            width:100%;

            padding:12px 16px;

            border:2px solid var(--cream-dark);

            border-radius:var(--radius-sm);

            font-family:var(--font-sans);

            background:#fcf8f1;

            color:var(--text-dark);

        }


        .register-form input:focus,
        .register-form textarea:focus {

            outline:none;

            border-color:var(--accent-gold);

            background:#fff;

        }

    <script>

        (function() {

            'use strict';


            // ==========================================
            // DATA — Edit these to update the website
            // ==========================================


            const booksData = [

                {
                    id: 1,
                    title: 'The River Between',
                    author: 'Ngũgĩ wa Thiong\'o',
                    cover: '📖',
                    meetingDate: '2026-08-15',
                    meetingTime: '3:00 PM EAT',
                    venue: 'Nexus Hub, Machakos Town',
                    description:
                    'A classic Kenyan novel exploring the clash between tradition and modernity in the colonial era.'
                },


                {
                    id: 2,
                    title: 'Half of a Yellow Sun',
                    author: 'Chimamanda Ngozi Adichie',
                    cover: '🌞',
                    meetingDate: '2026-09-12',
                    meetingTime: '4:00 PM EAT',
                    venue: 'Nexus Hub, Machakos Town',
                    description:
                    'A sweeping story of love, war, and the Biafran conflict — deeply moving and beautifully told.'
                },


                {
                    id: 3,
                    title: 'The Alchemist',
                    author: 'Paulo Coelho',
                    cover: '✨',
                    meetingDate: '2026-10-10',
                    meetingTime: '3:30 PM EAT',
                    venue: 'Nexus Hub, Machakos Town',
                    description:
                    'A timeless fable about following your dreams and listening to your heart — a club favourite.'
                },


                {
                    id: 4,
                    title: 'A Grain of Wheat',
                    author: 'Ngũgĩ wa Thiong\'o',
                    cover: '🌾',
                    meetingDate: '2026-11-14',
                    meetingTime: '3:00 PM EAT',
                    venue: 'Nexus Hub, Machakos Town',
                    description:
                    'Set during the Mau Mau uprising, this novel weaves together personal and political struggles.'
                }

            ];



            const defaultDiscussions = [

                {
                    id: 1,
                    author: 'Wanjiru N.',
                    book: 'The River Between',
                    text:
                    'How does the river symbolise the divide between the two communities? I would love to hear everyone’s take.',
                    date: '2026-07-20'
                },


                {
                    id: 2,
                    author: 'David O.',
                    book: 'Half of a Yellow Sun',
                    text:
                    'The portrayal of the Biafran war is so visceral. Which character did you find most compelling, and why?',
                    date: '2026-07-18'
                },


                {
                    id: 3,
                    author: 'Faith M.',
                    book: 'The Alchemist',
                    text:
                    'I found the idea of the Personal Legend really powerful. How do you interpret it?',
                    date: '2026-07-15'
                }

            ];            // ==========================================
            // RENDER BOOKS
            // ==========================================

            function renderBooks() {

                const grid = document.getElementById('booksGrid');

                if (!grid) return;


                if (booksData.length === 0) {

                    grid.innerHTML =
                    `<div class="books-empty">
                        📚 No books scheduled yet — check back soon!
                    </div>`;

                    return;
                }


                const sorted = [...booksData].sort((a, b) => {

                    return new Date(a.meetingDate) - new Date(b.meetingDate);

                });


                let html = '';


                sorted.forEach(book => {

                    const dateFormatted = formatDate(book.meetingDate);


                    html += `

                    <div class="book-card">

                        <div class="book-cover">
                            ${book.cover}
                        </div>


                        <h4>
                            ${book.title}
                        </h4>


                        <div class="book-author">
                            by ${book.author}
                        </div>


                        <div class="book-meta">

                            <span>
                                📅 ${dateFormatted}
                            </span>

                            <span>
                                ⏰ ${book.meetingTime}
                            </span>

                        </div>


                        <p class="book-desc">
                            ${book.description}
                        </p>


                        <div class="book-venue">
                            📍 ${book.venue}
                        </div>


                    </div>

                    `;

                });


                grid.innerHTML = html;

            }




            // ==========================================
            // RENDER DISCUSSIONS
            // ==========================================


            function getDiscussions() {


                let stored = [];


                try {

                    const raw =
                    localStorage.getItem('nexus_discussions');


                    if (raw) {

                        stored = JSON.parse(raw);


                        if (!Array.isArray(stored)) {

                            stored = [];

                        }

                    }


                } catch (_) {

                    stored = [];

                }



                const all = [...defaultDiscussions];


                const existingIds =
                new Set(all.map(d => d.id));



                stored.forEach(d => {

                    if (!existingIds.has(d.id)) {

                        all.push(d);

                    }

                });



                return all.sort((a,b) => {

                    return new Date(b.date) - new Date(a.date);

                });


            }




            function saveDiscussions(discs) {


                try {

                    localStorage.setItem(
                        'nexus_discussions',
                        JSON.stringify(discs)
                    );


                } catch (_) {

                    // Ignore storage errors

                }

            }





            function renderDiscussions() {


                const feed =
                document.getElementById('discussFeed');


                const count =
                document.getElementById('discussCount');



                if (!feed || !count) return;



                const discs =
                getDiscussions();



                count.textContent =
                `${discs.length} post${discs.length !== 1 ? 's' : ''}`;



                if (discs.length === 0) {


                    feed.innerHTML = `

                    <div class="discuss-empty">

                        <div class="empty-icon">
                            💭
                        </div>

                        <p>
                            No discussions yet.
                            Be the first to share your thoughts!
                        </p>

                    </div>

                    `;


                    return;

                }




                let html = '';



                discs.forEach(d => {


                    html += `

                    <div class="discuss-item">


                        <div class="item-header">


                            <span class="item-author">
                                ${escapeHtml(d.author)}
                            </span>


                            <span class="item-book">
                                📚 ${escapeHtml(d.book)}
                            </span>


                            <span class="item-date">
                                ${formatDate(d.date)}
                            </span>


                        </div>



                        <div class="item-text">
                            ${escapeHtml(d.text)}
                        </div>



                    </div>


                    `;


                });



                feed.innerHTML = html;


            }





            // ==========================================
            // ADD NEW DISCUSSION
            // ==========================================


            function addDiscussion(author, book, text) {


                const discs =
                getDiscussions();



                const newId =
                Date.now() + Math.floor(Math.random() * 1000);



                const now =
                new Date()
                .toISOString()
                .slice(0,10);



                discs.push({

                    id: newId,

                    author: author.trim(),

                    book: book.trim(),

                    text: text.trim(),

                    date: now

                });



                const defaultIds =
                new Set(defaultDiscussions.map(d => d.id));



                const toStore =
                discs.filter(d => !defaultIds.has(d.id));



                saveDiscussions(toStore);



                renderDiscussions();


            }            // ==========================================
            // HELPERS
            // ==========================================

            function formatDate(dateStr) {

                if (!dateStr) return 'TBD';


                try {

                    const d = new Date(dateStr);


                    if (isNaN(d.getTime())) {

                        return dateStr;

                    }


                    return d.toLocaleDateString('en-KE', {

                        year: 'numeric',

                        month: 'short',

                        day: 'numeric'

                    });


                } catch (_) {

                    return dateStr;

                }

            }





            function escapeHtml(str) {

                const div =
                document.createElement('div');


                div.textContent = str;


                return div.innerHTML;

            }





            // ==========================================
            // FORM HANDLING
            // ==========================================


            // ---- Registration Form ----

            const registerForm =
            document.getElementById('registerForm');


            const registerSuccess =
            document.getElementById('registerSuccess');



            if (registerForm) {


                registerForm.addEventListener('submit', function() {


                    setTimeout(() => {


                        registerSuccess.classList.add('show');


                        registerForm.reset();


                    }, 600);



                    const btn =
                    registerForm.querySelector('.btn-submit');



                    if (btn) {


                        btn.disabled = true;


                        btn.textContent =
                        'Submitting…';



                        setTimeout(() => {


                            btn.disabled = false;


                            btn.textContent =
                            'Join Nexus →';



                        }, 4000);


                    }


                });


            }






            // ---- Discussion Form ----


            const discussForm =
            document.getElementById('discussForm');


            const discussSuccess =
            document.getElementById('discussSuccess');



            if (discussForm) {


                discussForm.addEventListener('submit', function() {


                    const name =
                    document.getElementById('discussName')?.value || '';



                    const book =
                    document.getElementById('discussBook')?.value || '';



                    const text =
                    document.getElementById('discussText')?.value || '';




                    if (name && book && text) {


                        addDiscussion(
                            name,
                            book,
                            text
                        );


                    }





                    setTimeout(() => {


                        discussSuccess.classList.add('show');


                        discussForm.reset();



                    }, 400);





                    const btn =
                    discussForm.querySelector('.btn-submit');



                    if (btn) {


                        btn.disabled = true;


                        btn.textContent =
                        'Posting…';




                        setTimeout(() => {


                            btn.disabled = false;


                            btn.textContent =
                            'Post to Board →';



                        }, 4000);



                    }



                });


            }






            // ==========================================
            // NAVIGATION
            // ==========================================


            const navToggle =
            document.getElementById('navToggle');


            const navLinks =
            document.getElementById('navLinks');




            if (navToggle && navLinks) {



                navToggle.addEventListener('click', function() {



                    const isOpen =
                    navLinks.classList.toggle('open');



                    this.classList.toggle(
                        'active'
                    );



                    this.setAttribute(
                        'aria-expanded',
                        isOpen
                    );



                });





                navLinks.querySelectorAll('a')
                .forEach(link => {


                    link.addEventListener('click', () => {


                        navLinks.classList.remove('open');


                        navToggle.classList.remove('active');


                        navToggle.setAttribute(
                            'aria-expanded',
                            'false'
                        );


                    });


                });



            }            // ---- Active navigation on scroll ----

            const sections =
            document.querySelectorAll('section[id]');


            const navAnchors =
            document.querySelectorAll('.nav-links a');



            function updateActiveNav() {


                let current = '';



                sections.forEach(section => {


                    const top =
                    section.offsetTop - 100;



                    if (window.scrollY >= top) {


                        current =
                        section.getAttribute('id');


                    }


                });




                navAnchors.forEach(a => {


                    a.classList.toggle(

                        'active',

                        a.getAttribute('href') === '#' + current

                    );


                });


            }





            window.addEventListener(
                'scroll',
                updateActiveNav
            );


            window.addEventListener(
                'load',
                updateActiveNav
            );






            // ==========================================
            // INITIALISE WEBSITE
            // ==========================================


            renderBooks();


            renderDiscussions();





            // Refresh discussions when returning to tab

            document.addEventListener(
                'visibilitychange',
                () => {


                    if (!document.hidden) {


                        renderDiscussions();


                    }


                }
            );





            console.log(
                '📚 Nexus Book Club site loaded successfully!'
            );


            console.log(
                'ℹ️ Update books by editing the booksData array.'
            );



        })();

    </script>


</body>

</html>
