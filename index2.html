<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Book Club — Machakos, Kenya</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ========== CSS VARIABLES ========== */
        :root {
            --primary: #1B2A4A;
            --primary-light: #2D4A7A;
            --accent-gold: #D4A843;
            --accent-gold-light: #E8C96E;
            --accent-red: #C0392B;
            --cream: #F5F0E8;
            --cream-dark: #E8E0D6;
            --text-dark: #1A1A2E;
            --text-light: #F5F0E8;
            --text-muted: #6B6B7B;
            --shadow: 0 8px 32px rgba(27, 42, 74, 0.12);
            --shadow-hover: 0 12px 48px rgba(27, 42, 74, 0.20);
            --radius: 16px;
            --radius-sm: 8px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
            --max-width: 1200px;
            --nav-height: 72px;
        }

        /* ========== RESET & BASE ========== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: var(--nav-height); }
        body { font-family: var(--font-sans); background: var(--cream); color: var(--text-dark); line-height: 1.6; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        img { max-width: 100%; display: block; }
        ul { list-style: none; }
        .container { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }

        /* ========== UTILITY ========== */
        .section-title { font-family: var(--font-serif); font-size: clamp(2rem, 4vw, 2.8rem); font-weight: 700; color: var(--primary); margin-bottom: 8px; letter-spacing: -0.02em; }
        .section-subtitle { font-size: 1.05rem; color: var(--text-muted); margin-bottom: 40px; font-weight: 400; }
        .section-title .gold { color: var(--accent-gold); }
        .text-center { text-align: center; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border: none; border-radius: 50px; font-family: var(--font-sans); font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: var(--transition); background: var(--primary); color: #fff; box-shadow: 0 4px 16px rgba(27, 42, 74, 0.20); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(27, 42, 74, 0.30); }
        .btn-gold { background: var(--accent-gold); color: var(--primary); }
        .btn-gold:hover { background: var(--accent-gold-light); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); box-shadow: none; }
        .btn-outline:hover { background: var(--primary); color: #fff; transform: translateY(-2px); }

        /* ========== WATERMARK ========== */
        .watermark { position: fixed; bottom: 20px; right: 20px; opacity: 0.06; pointer-events: none; z-index: 0; font-family: var(--font-serif); font-size: 4rem; font-weight: 700; color: var(--primary); letter-spacing: 0.1em; line-height: 1; text-transform: uppercase; transform: rotate(-6deg); user-select: none; }
        @media (max-width: 768px) { .watermark { font-size: 2.4rem; bottom: 12px; right: 12px; opacity: 0.04; } }

        /* ========== NAVIGATION ========== */
        .navbar { position: fixed; top: 0; left: 0; right: 0; height: var(--nav-height); background: rgba(27, 42, 74, 0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.06); z-index: 1000; transition: var(--transition); }
        .navbar .container { display: flex; align-items: center; justify-content: space-between; height: 100%; }
        .nav-logo { display: flex; align-items: center; gap: 12px; font-family: var(--font-serif); font-weight: 700; font-size: 1.5rem; color: #fff; letter-spacing: -0.02em; }
        .nav-logo img { height: 40px; width: 40px; object-fit: cover; border-radius: 6px; }
        .nav-logo .logo-text { display: flex; flex-direction: column; line-height: 1.1; }
        .nav-logo .logo-text small { font-family: var(--font-sans); font-size: 0.55rem; font-weight: 400; color: var(--accent-gold); letter-spacing: 0.15em; text-transform: uppercase; }
        .nav-links { display: flex; align-items: center; gap: 8px; }
        .nav-links a { color: rgba(255, 255, 255, 0.75); font-size: 0.85rem; font-weight: 500; padding: 6px 14px; border-radius: 50px; transition: var(--transition); letter-spacing: 0.01em; }
        .nav-links a:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
        .nav-links a.active { color: #fff; background: rgba(212, 168, 67, 0.20); }
        .nav-toggle { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 4px; }
        .nav-toggle span { display: block; width: 26px; height: 2.5px; background: #fff; border-radius: 4px; transition: var(--transition); }
        .nav-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .nav-toggle.active span:nth-child(2) { opacity: 0; }
        .nav-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        /* ========== HERO ========== */
        .hero { padding: calc(var(--nav-height) + 60px) 0 80px; background: linear-gradient(145deg, var(--primary) 0%, var(--primary-light) 100%); color: #fff; position: relative; overflow: hidden; }
        .hero::before { content: ''; position: absolute; top: -40%; right: -20%; width: 80%; height: 120%; background: radial-gradient(ellipse at 70% 50%, rgba(212, 168, 67, 0.10) 0%, transparent 70%); pointer-events: none; }
        .hero .container { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
        .hero-content h1 { font-family: var(--font-serif); font-size: clamp(2.8rem, 6vw, 4.2rem); font-weight: 700; line-height: 1.12; margin-bottom: 16px; letter-spacing: -0.02em; }
        .hero-content h1 .gold { color: var(--accent-gold); }
        .hero-content .tagline { font-size: 1.15rem; color: rgba(255, 255, 255, 0.75); max-width: 480px; margin-bottom: 24px; font-weight: 300; line-height: 1.7; }
        .hero-badges { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
        .hero-badges span { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(4px); padding: 6px 18px; border-radius: 50px; font-size: 0.8rem; font-weight: 500; color: rgba(255, 255, 255, 0.85); border: 1px solid rgba(255, 255, 255, 0.06); }
        .hero-visual { display: flex; justify-content: center; align-items: center; }
        .hero-visual .logo-display { width: 100%; max-width: 380px; aspect-ratio: 1/1; background: rgba(255, 255, 255, 0.04); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255, 255, 255, 0.06); padding: 30px; }
        .hero-visual .logo-display img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

        /* ========== MISSION / VISION ========== */
        .mission-section { padding: 80px 0 60px; background: #fff; }
        .mission-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 20px; }
        .mission-card { background: var(--cream); padding: 40px 36px; border-radius: var(--radius); box-shadow: var(--shadow); transition: var(--transition); border: 1px solid rgba(27, 42, 74, 0.04); }
        .mission-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
        .mission-card .icon { font-size: 2.4rem; margin-bottom: 12px; }
        .mission-card h3 { font-family: var(--font-serif); font-size: 1.5rem; color: var(--primary); margin-bottom: 8px; }
        .mission-card p { color: var(--text-muted); font-size: 0.98rem; line-height: 1.7; }

        /* ========== REGISTRATION ========== */
        .register-section { padding: 80px 0; background: var(--cream); }
        .register-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; }
        .register-info h2 { font-family: var(--font-serif); font-size: 2.2rem; color: var(--primary); margin-bottom: 12px; }
        .register-info p { color: var(--text-muted); margin-bottom: 20px; font-size: 1rem; line-height: 1.8; }
        .register-info .benefits { display: flex; flex-direction: column; gap: 10px; }
        .register-info .benefits li { display: flex; align-items: center; gap: 12px; font-size: 0.95rem; color: var(--text-dark); }
        .register-info .benefits li::before { content: '✦'; color: var(--accent-gold); font-size: 1.2rem; }
        .register-form { background: #fff; padding: 40px 36px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid rgba(27, 42, 74, 0.06); }
        .register-form .form-group { margin-bottom: 18px; }
        .register-form label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--primary); margin-bottom: 4px; }
        .register-form label .required { color: var(--accent-red); }
        .register-form input, .register-form select, .register-form textarea { width: 100%; padding: 12px 16px; border: 2px solid #E8E0D6; border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: 0.95rem; transition: var(--transition); background: #faf8f5; color: var(--text-dark); }
        .register-form input:focus, .register-form select:focus, .register-form textarea:focus { outline: none; border-color: var(--accent-gold); background: #fff; box-shadow: 0 0 0 4px rgba(212, 168, 67, 0.12); }
        .register-form textarea { resize: vertical; min-height: 80px; }
        .register-form .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .register-form .btn-submit { width: 100%; padding: 14px; font-size: 1rem; margin-top: 4px; }
        .form-success { display: none; background: #e6f7e6; color: #1a6e1a; padding: 16px 20px; border-radius: var(--radius-sm); margin-top: 16px; text-align: center; font-weight: 500; }
        .form-success.show { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ========== BOOKS & MEETINGS ========== */
        .books-section { padding: 80px 0; background: #fff; }
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 28px; margin-top: 20px; }
        .book-card { background: var(--cream); border-radius: var(--radius); padding: 28px 24px 32px; box-shadow: var(--shadow); transition: var(--transition); border: 1px solid rgba(27, 42, 74, 0.04); display: flex; flex-direction: column; }
        .book-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
        .book-card .book-cover { font-size: 3.2rem; margin-bottom: 12px; }
        .book-card h4 { font-family: var(--font-serif); font-size: 1.25rem; color: var(--primary); margin-bottom: 2px; }
        .book-card .book-author { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; margin-bottom: 10px; }
        .book-card .book-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.82rem; color: var(--text-muted); margin: 8px 0 12px; padding-top: 8px; border-top: 1px solid rgba(27, 42, 74, 0.06); }
        .book-card .book-desc { font-size: 0.92rem; color: var(--text-muted); line-height: 1.6; flex: 1; }
        .book-card .book-venue { margin-top: 12px; font-size: 0.85rem; font-weight: 500; color: var(--primary); background: rgba(212, 168, 67, 0.10); padding: 6px 14px; border-radius: 50px; display: inline-block; align-self: flex-start; }

        /* ========== DISCUSSION BOARD ========== */
        .discuss-section { padding: 80px 0; background: var(--cream); }
        .discuss-wrapper { display: grid; grid-template-columns: 1fr 1.2fr; gap: 50px; align-items: start; margin-top: 12px; }
        .discuss-form-box { background: #fff; padding: 32px 28px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid rgba(27, 42, 74, 0.06); }
        .discuss-form-box h3 { font-family: var(--font-serif); font-size: 1.4rem; color: var(--primary); margin-bottom: 4px; }
        .discuss-feed { display: flex; flex-direction: column; gap: 20px; }
        .discuss-item { background: #fff; padding: 20px 24px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid rgba(27, 42, 74, 0.04); }

        /* ========== CONSTITUTION + SOCIAL ========== */
        .footer-links-section { padding: 60px 0 40px; background: var(--primary); color: rgba(255, 255, 255, 0.8); }
        .footer-links-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 40px; align-items: start; }
        .footer-links-grid h4 { font-family: var(--font-serif); color: #fff; font-size: 1.2rem; margin-bottom: 12px; }
        .footer-links-grid .constitution-link { display: inline-flex; align-items: center; gap: 10px; padding:
